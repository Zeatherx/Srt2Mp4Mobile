name: srt2mp4_mobile
description: Burn SRT subtitles into MP4 videos entirely on device.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  # Full GPL: both libx264 AND libass. min_gpl cannot burn subtitles.
  ffmpeg_kit_flutter_new: 4.6.7
  file_picker: 8.3.7
  chewie: ^1.11.3
  video_player: ^2.10.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  path: ^1.9.1
  google_mlkit_translation: ^0.13.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  path_provider_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/OFL.txt
    - assets/fonts/NotoSansCJKsc-Regular.otf
    - assets/fonts/OFL-CJK.txt

flutter_launcher_icons:
  android: true
  ios: true
  # Keep home-screen launcher icons at their original size.
  image_path: assets/icon/app_icon_original.png
  min_sdk_android: 24
  remove_alpha_ios: true
  background_color_ios: '#060A12'

flutter_native_splash:
  color: '#060A12'
  color_dark: '#060A12'
  image: assets/icon/app_icon.png
  image_dark: assets/icon/app_icon.png
  android: true
  ios: true
  web: false
  android_12:
    color: '#060A12'
    color_dark: '#060A12'
    image: assets/icon/app_icon.png
    image_dark: assets/icon/app_icon.png
    icon_background_color: '#060A12'
    icon_background_color_dark: '#060A12'
